  <g id="upper-section">
    <!-- Tu producto: 5 filled hexagons -->
    <g id="product-filled" transform="translate(100,380)">
      <path d="M50,5 L92,28 L92,72 L50,95 L8,72 L8,28 Z" fill="#2563EB"/>
      <path d="M50,5 L92,28 L92,72 L50,95 L8,72 L8,28 Z" fill="#2563EB" transform="translate(100,0)"/>
      <path d="M50,5 L92,28 L92,72 L50,95 L8,72 L8,28 Z" fill="#2563EB" transform="translate(200,0)"/>
      <path d="M50,5 L92,28 L92,72 L50,95 L8,72 L8,28 Z" fill="#2563EB" transform="translate(300,0)"/>
      <path d="M50,5 L92,28 L92,72 L50,95 L8,72 L8,28 Z" fill="#2563EB" transform="translate(400,0)"/>
    </g>

    <!-- Tus ventas: downward trend icon -->
    <text x="50" y="440" font-family="Inter, system-ui, sans-serif" font-size="36" fill="#111827">Tus ventas:</text>
    <path d="M550,460 L570,490 L550,520" stroke="#06B6D4" stroke-width="3" fill="none" marker-end="url(#arrow-down)"/>
  </g>

  <g id="middle">
    <text x="540" y="550" font-family="Inter, system-ui, sans-serif" font-size="32" fill="#111827" text-anchor="middle">
      El problema no es tu producto. Es tu presencia digital.
    </text>
  </g>

  <g id="lower-section">
    <!-- Su producto: 2 outline hexagons -->
    <text x="50" y="720" font-family="Inter, system-ui, sans-serif" font-size="36" fill="#111827">Su producto:</text>
    <path d="M200,740 L72,28 L92,72 L50,95 L8,72 L8,28 Z" fill="none" stroke="#2563EB" stroke-width="2" transform="translate(200,720)"/>
    <path d="M500,740 L72,28 L92,72 L50,95 L8,72 L8,28 Z" fill="none" stroke="#2563EB" stroke-width="2" transform="translate(400,720)"/>

    <!-- Sus ventas: up arrow -->
    <text x="500" y="720" font-family="Inter, system-ui, sans-serif" font-size="36" fill="#111827" text-anchor="middle">Sus ventas: suben</text>
    <path d="M700,760 L720,730 L700,700" stroke="#10B981" stroke-width="3" fill="none" marker-end="url(#arrow-up)"/>
  </g>

  <g id="cta">
    <text x="540" y="850" font-family="Inter, system-ui, sans-serif" font-size="36" fill="#111827" text-anchor="middle">
      Comenta AUDITORIA WEB LANZAMIENTO ORDEN y recibe diagnóstico gratuito
    </text>
  </g>

  <g id="footer">
    <text x="540" y="950" font-family="Inter, system-ui, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">
      SINERGIA - Menos caos. Más claridad. Más ventas.
    </text>
  </g>

  <defs>
    <marker id="arrow-down" markerWidth="10" markerHeight="10" refX="0" refY="5" orient="auto" markerUnits="strokeWidth">
